<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - สรุปผลสอบ</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background-color: #f8f9fa; }
        .pass { color: #28a745; font-weight: bold; }
        .fail { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>สรุปผลการสอบพนักงาน</h2>
    <input type="text" id="searchInput" placeholder="กรองชื่อพนักงานเพื่อค้นหา..." onkeyup="filterTable()">
    
    <table>
        <thead>
            <tr>
                <th>ชื่อพนักงาน</th>
                <th>ชุดที่</th>
                <th>วันที่/เวลา</th>
                <th>สถานะ</th>
                <th>เวลาที่ใช้</th>
            </tr>
        </thead>
        <tbody id="resultsTableBody">
            <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
    const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno'; 
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allAttempts = []; 

    async function loadResults() {
        const tbody = document.getElementById('resultsTableBody');
        const { data, error } = await supabase
            .from('results')
            .select('user_name, set_id, submitted_at, is_passed, duration_minutes')
            .order('submitted_at', { ascending: false });
        
        if (error) { 
            console.error(error); 
            tbody.innerHTML = `<tr><td colspan="5">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            return; 
        }

        allAttempts = data || [];
        renderTable(allAttempts);
    }

    function renderTable(data) {
        const tbody = document.getElementById('resultsTableBody');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5">ไม่พบข้อมูล</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(row => {
            const duration = row.duration_minutes || 0;
            const isSuspicious = (duration < 2); 
            const dateStr = row.submitted_at ? new Date(row.submitted_at).toLocaleString('th-TH') : '-';

            return `
                <tr style="${isSuspicious ? 'background-color: #ffe6e6;' : ''}">
                    <td>${row.user_name || '-'}</td>
                    <td>${row.set_id || '-'}</td>
                    <td>${dateStr}</td>
                    <td class="${row.is_passed ? 'pass' : 'fail'}">${row.is_passed ? 'ผ่าน' : 'ไม่ผ่าน'}</td>
                    <td>${duration} นาที ${isSuspicious ? '⚠️' : ''}</td>
                </tr>
            `;
        }).join('');
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allAttempts.filter(item => 
            item.user_name && item.user_name.toLowerCase().includes(query)
        );
        renderTable(filtered);
    }
    
    loadResults();
</script>
</body>
</html>
